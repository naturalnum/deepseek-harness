# Account-native Cloud composition. Root separately mounts ./cloud-assets and approves the exact research preset.
- insert:
    - id: cloud-research
      name: deepscientist-harness-suite/cloud
      config:
        maxDatabaseBytes: 268435456
        maxRequestBytes: 8388608
        maxReplyBytes: 8388608
        maxPendingRequests: 2
        executionTimeoutMs: 180000
        maxPayloadBytes: 8388608
        maxOutputBytes: 32768
        graceMs: 1000
        pythonPath: /opt/dsh/runtime/dependencies/python/bin/python3
        gitPath: /usr/bin/git
        maxConcurrentResourcePreparations: 1
        maxSkillProviders: 64
        maxSkillFiles: 1024
        maxSkillBytes: 33554432
        maxSkillFileBytes: 4194304
        maxSkillPathBytes: 256
        expectedPythonVersion: '3.13'
        expectedAiralogyVersion: 0.16.0
    - id: ds-preset-research
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: research-suite
        name: 科学研究 · DeepScientist
        description: DeepScientist 驱动调研、实验与分析，Airalogy 辅助记录与归档
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a research agent powered by the {{model}} model.
              suffix: Read research-science for research work. Read research-gewu when the user authorizes sustained research. Use native execution, files and Goal tools; do not start another controller. Research tools save to this conversation's right-sidebar workbench automatically. Use present for completed files so their real bytes appear in the workbench (2 MiB per file). Use research_chart_render for charts, AIMD protocols and research records for structured results. Never claim a file was saved without a successful tool result. For evidence review, route selection, skill publication, engine package approval and record submission or lifecycle changes, call the corresponding research tool to request a native human question in this conversation. Only its explicit authenticated human response approves that exact version. Never self-approve or obtain human credentials.
          - id: agent-instructions
            name: cordis:pe-account-instructions-session
            config:
              maxFiles: 2
              maxFileBytes: 8192
              maxTotalBytes: 16384
              maxSnapshotBytes: 65536
              maxResidentBytes: 3145728
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: research-skills
            name: deepscientist-harness-suite/research
          - id: research-tools
            name: deepscientist-harness-suite/airalogy
    - id: research-workbench
      name: deepscientist-harness-suite
