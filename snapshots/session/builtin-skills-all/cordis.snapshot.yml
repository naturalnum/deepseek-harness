# Replay patch shared by the ordinary headless snapshot composition. The model
# script comes from the scenario's committed session JSONL.

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

- id: session-title-llm
  disabled: true

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro
          - id: deepseek-messages
            name: DeepSeek Messages
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro

- insert:
    - id: skill-office
      name: '@deepseek-ai/dsh-skill-office'
      disabled: false
      config:
        assetRoot: !!js process.cwd() + '/office-skills'
        executionRoot: /opt/dsh/skills/office
        systemTools:
          soffice: /usr/bin/soffice
          pdftoppm: /usr/bin/pdftoppm

- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true

- insert:
    - id: bundled-report-skills
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: dsh-reports
        includeDefaultRoots: false
        watch: false
        bundledSkillDir: !!js process.cwd() + '/report-skills'
        bundledExecutionRoot: /opt/dsh/skills/reports
        packagedBundles: true
