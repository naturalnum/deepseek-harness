services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: powerevolve
      POSTGRES_USER: powerevolve
      POSTGRES_PASSWORD_FILE: /run/secrets/database-password
    secrets: [database-password]
    ports: ["127.0.0.1:18432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U powerevolve -d powerevolve"]
      interval: 2s
      timeout: 3s
      retries: 30
secrets:
  database-password:
    file: ${PE_PRIVATE_DIR:?Set PE_PRIVATE_DIR}/database-password
volumes:
  postgres-data:
