apiVersion: v1
kind: ServiceAccount
metadata:
  name: power-evolve-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: power-evolve-platform
rules:
  - apiGroups: [agents.x-k8s.io]
    resources: [sandboxes]
    verbs: [get, list, create, delete]
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, patch]
  - apiGroups: ['']
    resources: [services, secrets]
    verbs: [get, create, delete]
  - apiGroups: ['']
    resources: [services/proxy]
    verbs: [get, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: power-evolve-platform
subjects:
  - kind: ServiceAccount
    name: power-evolve-platform
    namespace: placeholder
roleRef:
  kind: Role
  name: power-evolve-platform
  apiGroup: rbac.authorization.k8s.io
