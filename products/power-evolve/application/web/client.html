<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PowerEvolve</title><link rel="stylesheet" href="/style.css"></head>
<body>
  <aside class="left-sidebar"><header class="brand"><div class="brand-mark">P</div><strong>PowerEvolve</strong></header><p id="trial" class="muted"></p><button id="new-chat"></button><nav class="product-nav" aria-label="产品导航"><button id="files-link" class="quiet" type="button"></button><button id="skills-link" class="quiet" type="button"></button><button id="actions-link" class="quiet" type="button"></button><button id="executions-link" class="quiet" type="button"></button></nav><h2 id="history-label"></h2><nav id="sessions" aria-label="会话"></nav><footer><span id="identity"></span><button id="signout" class="quiet"></button></footer></aside>
  <main class="conversation"><header class="topbar"><span id="title"></span><div class="top-actions"><span id="model" class="badge"></span><a id="approvals-link" class="quiet-link" target="_blank" rel="noopener"></a><button id="toggle-panel" class="quiet" type="button"></button></div></header><section id="messages" aria-live="polite"></section><div class="composer-wrap"><div id="status" role="status"></div><form id="composer"><textarea id="prompt" rows="2" required maxlength="16384"></textarea><button id="send" type="submit"></button></form><p id="error" role="alert"></p></div></main>
  <aside id="right-panel" class="right-panel" aria-label="内容侧栏" hidden><header class="panel-header"><h2 id="panel-title"></h2><button id="close-panel" class="quiet" type="button" aria-label="关闭侧栏">×</button></header><div class="panel-tabs"><button id="files-tab" type="button"></button><button id="skills-tab" type="button"></button><button id="actions-tab" type="button"></button><button id="executions-tab" type="button"></button></div><section id="files-panel" class="panel-content"><div class="file-actions"><button id="file-up" class="quiet" type="button"></button><label class="file-upload"><span id="file-upload-label"></span><input id="file-input" type="file"></label></div><div id="file-location" class="muted"></div><div id="file-list"></div><div id="file-preview" hidden><h3 id="file-name"></h3><p id="file-meta" class="muted"></p><textarea id="file-editor" rows="12" aria-label="文件内容"></textarea><div class="file-actions"><button id="file-save" type="button"></button><button id="file-download" class="quiet" type="button"></button></div></div></section><section id="skills-panel" class="panel-content" hidden><div id="skill-list"></div><form id="skill-install"><h3 id="skill-install-title"></h3><input id="skill-name" required maxlength="80"><input id="skill-description" required maxlength="500"><textarea id="skill-instructions" required maxlength="4096" rows="8"></textarea><button id="skill-install-button" type="submit"></button></form><div id="skill-detail" hidden><h3 id="skill-detail-name"></h3><p id="skill-detail-description"></p><pre id="skill-detail-instructions"></pre></div></section><section id="actions-panel" class="panel-content" hidden><div class="file-actions"><button id="actions-refresh" class="quiet" type="button"></button><a id="actions-approval" class="quiet-link" target="_blank" rel="noopener"></a></div><div id="action-list"></div></section><section id="executions-panel" class="panel-content" hidden><div class="file-actions"><button id="executions-refresh" class="quiet" type="button"></button></div><div id="execution-list"></div></section><p id="panel-error" role="alert"></p></aside>
  <script type="module" src="/app.js"></script>
</body></html>
