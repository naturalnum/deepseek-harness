- insert:
    - id: logger-console
      name: '@deepseek-ai/cordis-plugin-logger-console'
      config:
        colors: false
        maxLength: 1200
    - id: timer
      name: '@deepseek-ai/cordis-plugin-timer'
    - id: llm
      name: '@deepseek-ai/dsh-llm'
    - id: session
      name: '@deepseek-ai/dsh-session'
    - id: session-projection
      name: '@deepseek-ai/dsh-session-projection'
    - id: session-title
      name: '@deepseek-ai/dsh-session-title'
      config:
        fallbackMaxWords: 20
        fallbackMaxBytes: 200
        maxTitleBytes: 4096
    - id: tools
      name: '@deepseek-ai/dsh-tools'
    - id: agent
      name: '@deepseek-ai/dsh-agent'
    - id: skill
      name: '@deepseek-ai/dsh-skill'
    - id: tool-skill
      name: '@deepseek-ai/dsh-tool-skill'
    - id: typert
      name: '@deepseek-ai/dsh-typert-registry'
    - id: api-gateway
      name: '@deepseek-ai/dsh-api-gateway'
    - id: plugin-manager
      name: '@deepseek-ai/dsh-plugin-manager'
    - id: system-prompt
      name: '@deepseek-ai/dsh-system-prompt'
      config:
        includeHarnessIdentity: false
        includeRuntimeContext: false
        personaPrefix: You are PowerEvolve, a helpful assistant. Commands run in the authorized cloud workspace. Inspect the trusted tool result before continuing. You may query controlled trial notes or propose a note append for separate human approval.
    - id: agent-loop
      name: '@deepseek-ai/dsh-agent-loop'
      config:
        agents: []
    - id: web-server
      name: '@deepseek-ai/dsh-host-webserver'
      config:
        host: 127.0.0.1
        port: 18880
    - id: power-evolve-runtime
      name: '@power-evolve/application/scope'
      config:
        platformUrl: http://127.0.0.1:18881
        workerTokenFile: !!js process.env.PE_PRIVATE_DIR + '/worker-token'
        workerId: !!js process.env.PE_HOST_WORKER_ID || ''
        timeoutMs: 15000
        maxResponseBytes: 67108864
        nativeIntentReconcileLimit: 32
        nativeIntentMaxLocalReceipts: 65536
    - id: power-evolve-persistence
      name: '@power-evolve/application/persistence'
    - id: power-evolve-model
      name: '@power-evolve/application/model'
      config:
        streamIdleTimeoutMs: 120000
    - id: power-evolve-host
      name: '@power-evolve/application/host'
      config:
        officePreviewEnabled: !!js process.env.PE_OFFICE_PREVIEW_ENABLED === '1'
        officePreviewPollMs: 500
        officePreviewRenderDeadlineMs: 240000
        officePreviewCancelTimeoutMs: 10000
        officePreviewMaxActiveRenders: 4
        origin: http://127.0.0.1:18880
        platformOrigin: http://127.0.0.1:18881
        concurrency: 4
        nativeShellEnabled: !!js process.env.PE_NATIVE_SHELL_ENABLED === '1'
        shellPollMs: 250
        shellTimeoutMs: 120000
        shellMaxTimeoutMs: 120000
        shellMaxOutputBytes: 65536
        pollMs: 500
        renewMs: 8000
        operationTimeoutMs: !!js process.env.PE_NATIVE_SHELL_ENABLED === '1' ? 600000 : 150000
        maxRequestBytes: 50331648
        maxStreams: 100
        fileDownloadTimeoutMs: 60000
        readyFile: !!js dshHomePath('ready.json')
